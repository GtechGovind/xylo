[package]
name = "xylo"
default-run = "xylo"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gpui-kit = { version = "=0.8.1", features = ["tree-sitter", "tree-sitter-rust", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-python", "tree-sitter-typescript", "tree-sitter-javascript", "tree-sitter-markdown"] }
xylo-core.workspace = true
xylo-runtime.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rfd = "0.17"
shell-words = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"

lsp-types = { version = "0.97", features = ["proposed"] }

async-channel = "2"
tray-icon = { version = "=0.26.1", default-features = false, features = ["ksni"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSGeometry"] }


[dev-dependencies]
gpui-kit = { version = "=0.8.1", features = ["test-support"] }
tempfile = "3"
sha2 = "0.11"
hex = "0.4"

[build-dependencies]
xylo-build = { path = "../..", optional = true }
embed-resource = "=3.0.12"
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[features]
default = ["bundled-browser"]
# Build and stage the pinned browser alongside normal Cargo app artifacts.
bundled-browser = ["dep:xylo-build"]
# Test-only accessors used by the native validation crate in `validation/`,
# which compiles these sources with this feature on. Never enabled in the app.
validation = []
