[package]
name = "xylo"
default-run = "xylo"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gpui-kit = { version = "=0.8.0", features = ["tree-sitter", "tree-sitter-rust", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-python", "tree-sitter-typescript", "tree-sitter-javascript", "tree-sitter-markdown"] }
xylo-core.workspace = true
xylo-runtime.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rfd = "0.15"
shell-words = "1"

ignore = "0.4"
lsp-types = { version = "0.97", features = ["proposed"] }

async-channel = "2"
tray-icon = { version = "=0.26.1", default-features = false, features = ["ksni"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }



[dev-dependencies]
tempfile = "3"
sha2 = "0.10"
