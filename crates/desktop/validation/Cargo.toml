[package]
name="xylo-native-validation"
version="0.1.0"
edition="2024"
[dependencies]
gpui-kit={version="=0.8.1",features=["test-support","tree-sitter","tree-sitter-rust", "tree-sitter-c", "tree-sitter-cpp","tree-sitter-python","tree-sitter-typescript","tree-sitter-javascript","tree-sitter-markdown"]}
xylo-core={path="../../core"}
xylo-runtime={path="../../runtime"}
xylo-services={path="../../services"}
anyhow="1"
serde={version="1",features=["derive"]}
serde_json="1"
tokio={version="1",features=["full"]}
tokio-util="0.7"
uuid={version="1",features=["v4","v5","serde"]}
tracing="0.1"
ignore = "0.4"
lsp-types = { version = "0.97", features = ["proposed"] }

tempfile="3"
rusqlite={version="0.41",features=["bundled"]}
async-channel="2"
zip={version="6",default-features=false,features=["deflate"]}
rfd="0.17"
shell-words="1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
sha2="0.11"
hex="0.4"
image={version="=0.25.10",default-features=false,features=["png"]}


[workspace]

# Capture and acceptance executables are regenerated on demand. Keep their
# large copied desktop sources out of incremental caches and debug symbols.
[profile.dev]
debug = false
incremental = false

# Same as the main workspace: dependencies lightly optimized in development.
[profile.dev.package."*"]
opt-level = 1
debug = false

# This is a separate workspace, so its path dependencies otherwise inherit
# the wildcard dependency profile. Match the main workspace's local crates
# to reuse their artifacts when the enabled features also match.
[profile.dev.package.xylo-core]
opt-level = 0
debug = 1
incremental = true
[profile.dev.package.xylo-distribution]
opt-level = 0
debug = 1
incremental = true
[profile.dev.package.xylo-helper-client]
opt-level = 0
debug = 1
incremental = true
[profile.dev.package.xylo-notifications]
opt-level = 0
debug = 1
incremental = true
[profile.dev.package.xylo-resources]
opt-level = 0
debug = 1
incremental = true
[profile.dev.package.xylo-runtime]
opt-level = 0
debug = 1
incremental = true
[profile.dev.package.xylo-scheduler]
opt-level = 0
debug = 1
incremental = true
[profile.dev.package.xylo-services]
opt-level = 0
debug = 1
incremental = true

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 16

[features]
default = ["validation"]
# Compiles the desktop sources' test-only accessors (see crates/desktop/Cargo.toml).
validation = []
performance = []

[[bin]]
name="native-performance"
path="performance.rs"
required-features = ["performance"]

[[test]]
name="native-interactions"
path="interactions.rs"

[[test]]
name="native-rendering"
path="rendering.rs"
harness=false

[[test]]
name="settings-rendering"
path="settings_rendering.rs"
harness=false

[[test]]
name="workspace-interactions"
path="workspace_interactions.rs"

[[test]]
name="updater-interactions"
path="updater_interactions.rs"

[[test]]
name="draft-interactions"
path="draft_interactions.rs"

[[test]]
name="vision-interactions"
path="vision_interactions.rs"

[[test]]
name="notification-interactions"
path="notification_interactions.rs"

[[test]]
name="memory-interactions"
path="memory_interactions.rs"

[[test]]
name="image-generation-interactions"
path="image_generation_interactions.rs"

[[test]]
name="document-interactions"
path="document_interactions.rs"

[[test]]
name="management-interactions"
path="management_interactions.rs"

[[test]]
name="recovery-interactions"
path="recovery_interactions.rs"

[[test]]
name="recovery-rendering"
path="recovery_rendering.rs"
harness=false

[[test]]
name="document-recovery-interactions"
path="document_recovery_interactions.rs"

[[test]]
name="document-recovery-rendering"
path="document_recovery_rendering.rs"
harness=false

[[test]]
name="terminal-rendering"
path="terminal_rendering.rs"
harness=false

[[test]]
name="terminal-workspace-interactions"
path="terminal_workspace_interactions.rs"

[[test]]
name="composer-rendering"
path="composer_rendering.rs"
harness=false

[[test]]
name="file-tree-interactions"
path="file_tree_interactions.rs"

[[test]]
name="file-tree-rendering"
path="file_tree_rendering.rs"
harness=false

[[test]]
name="account-interactions"
path="account_interactions.rs"

[[test]]
name="composer-interactions"
path="composer_interactions.rs"

[[test]]
name="extension-rendering"
path="extension_rendering.rs"
harness=false

[[test]]
name="portable-tool-rendering"
path="portable_tool_rendering.rs"
harness=false

[[test]]
name="paste-rendering"
path="paste_rendering.rs"
harness=false

# Same patch as the main workspace; see third_party/block/XYLO_PATCH.md.
[patch.crates-io]
block = { path = "../../../third_party/block" }
