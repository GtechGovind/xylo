[package]
name="xylo-native-validation"
version="0.1.0"
edition="2024"
[dependencies]
gpui-kit={version="=0.8.0",features=["test-support","tree-sitter","tree-sitter-rust", "tree-sitter-c", "tree-sitter-cpp","tree-sitter-python","tree-sitter-typescript","tree-sitter-javascript","tree-sitter-markdown"]}
xylo-core={path="../../core"}
xylo-runtime={path="../../runtime"}
xylo-services={path="../../services"}
anyhow="1"
serde={version="1",features=["derive"]}
serde_json="1"
tokio={version="1",features=["full"]}
tokio-util="0.7"
uuid={version="1",features=["v4","serde"]}
tracing="0.1"
ignore = "0.4"
lsp-types = { version = "0.97", features = ["proposed"] }

tempfile="3"
rusqlite={version="0.32",features=["bundled"]}
async-channel="2"
zip={version="6",default-features=false,features=["deflate"]}
rfd="0.15"
shell-words="1"
sha2="0.10"
image={version="=0.25.10",default-features=false,features=["png"]}


[workspace]

# Match the desktop application's development debug information setting.
[profile.dev]
debug = 1

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 16

[features]
performance = []

[[bin]]
name="native-performance"
path="performance.rs"
required-features = ["performance"]

[[test]]
name="native-interactions"
path="interactions.rs"

[[test]]
name="native-rendering"
path="rendering.rs"
harness=false

[[test]]
name="workspace-interactions"
path="workspace_interactions.rs"

[[test]]
name="updater-interactions"
path="updater_interactions.rs"

[[test]]
name="draft-interactions"
path="draft_interactions.rs"

[[test]]
name="vision-interactions"
path="vision_interactions.rs"

[[test]]
name="notification-interactions"
path="notification_interactions.rs"

[[test]]
name="memory-interactions"
path="memory_interactions.rs"

[[test]]
name="image-generation-interactions"
path="image_generation_interactions.rs"

[[test]]
name="document-interactions"
path="document_interactions.rs"

[[test]]
name="management-interactions"
path="management_interactions.rs"

[[test]]
name="recovery-interactions"
path="recovery_interactions.rs"

[[test]]
name="recovery-rendering"
path="recovery_rendering.rs"
harness=false

[[test]]
name="document-recovery-interactions"
path="document_recovery_interactions.rs"

[[test]]
name="document-recovery-rendering"
path="document_recovery_rendering.rs"
harness=false

[[test]]
name="terminal-rendering"
path="terminal_rendering.rs"
harness=false

[[test]]
name="terminal-workspace-interactions"
path="terminal_workspace_interactions.rs"

[[test]]
name="composer-rendering"
path="composer_rendering.rs"
harness=false

[[test]]
name="file-tree-interactions"
path="file_tree_interactions.rs"

[[test]]
name="file-tree-rendering"
path="file_tree_rendering.rs"
harness=false

[[test]]
name="account-interactions"
path="account_interactions.rs"

[[test]]
name="composer-interactions"
path="composer_interactions.rs"
