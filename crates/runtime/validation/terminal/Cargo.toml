[package]
name = "workbench-terminal-validation"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false

# The real terminal and its existing tests, without GPUI/provider dependencies.
[workspace]

[dependencies]
anyhow = "=1.0.104"
alacritty_terminal = "=0.25.1"
portable-pty = "=0.9.0"
parking_lot = "=0.12.5"
tokio = { version = "=1.54.1", features = ["rt", "macros", "sync", "time"] }
libc = "=0.2.191"

[dev-dependencies]
tempfile = "=3.27.0"
# The production module includes its opt-in measurement test at compile time.
serde_json = "=1.0.154"
sha2 = "=0.10.9"
sysinfo = { version = "=0.31.4", default-features = false, features = ["system"] }
