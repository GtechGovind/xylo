[package]
name = "xylo-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tempfile = "3"
xylo-core.workspace = true
xylo-resources.workspace = true
xylo-services.workspace = true
xylo-scheduler.workspace = true
xylo-helper-client.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
tracing.workspace = true
rusqlite = { version = "0.41", features = ["bundled"] }
futures-util = "0.3"
directories = "6"
portable-pty = "0.9"
alacritty_terminal = "0.26"
parking_lot = "0.12"
async-channel = "2"
fs2 = "0.4"
libc = "0.2"
url = "2"
sha2 = "0.11"
hex = "0.4"
notify = "=8.2.1"
ignore = "0.4"
grep-searcher = "=0.1.17"
grep-regex = "=0.1.14"
grep-matcher = "=0.1.9"
xylo-distribution.workspace = true
xylo-notifications.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
tempfile = "3"
minisign = "=0.10.0"
base64 = "0.22"
