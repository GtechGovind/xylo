[package]
name = "xylo-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
xylo-core.workspace = true
xylo-runtime.workspace = true
xylo-resources.workspace = true
xylo-services.workspace = true
xylo-capabilities.workspace = true
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
tracing.workspace = true
parking_lot = "0.12"
futures-util = "0.3"
async-stream = "0.3"
fs2 = "0.4"
tempfile = "3"
tiktoken-rs = "0.12.1"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ignore = "0.4"
globset = "0.4"
grep-searcher = "=0.1.17"
grep-regex = "=0.1.14"
similar = "2"
shell-words = "1"
sha2 = "0.11"
hex = "0.4"
hmac = "0.13"
# Tool-argument validation; offline only (no remote `$ref` resolution).
jsonschema = { version = "=0.58.6", default-features = false }

[dev-dependencies]
xylo-services = { workspace = true, features = ["test-support"] }
keyring-core = "1.0.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
