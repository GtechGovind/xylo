[package]
name = "workbench-notifications"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
tracing.workspace = true
async-channel = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSBundle", "NSError", "NSObject", "NSString"] }
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationSettings", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNNotification", "UNNotificationResponse"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_System_WinRT"] }
windows-registry = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
# Compile the portable D-Bus adapter in isolated tests on macOS too. No daemon is used.
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = "0.3"
