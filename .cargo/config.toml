# Both Cargo workspaces use one cache when invoked from this repository.
# Cargo still separates artifacts whose versions/features/profiles differ.
[build]
target-dir = "target"

[alias]
# Run aliases from the repository root. Evaluation tooling is opt-in.
app = "build --locked -p xylo -p xylo-worker -p xylo-helper -p xylo-cli --bins"
app-release = "build --locked --release -p xylo -p xylo-worker -p xylo-helper -p xylo-cli --bins"
native-test = "test --locked --manifest-path crates/desktop/validation/Cargo.toml"
