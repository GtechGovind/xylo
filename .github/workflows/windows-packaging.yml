name: Windows native packaging tool checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/release_windows*.py"
      - "scripts/release_smoke.py"
      - "scripts/release_common.py"
      - "scripts/test_release_windows*.py"
      - ".github/workflows/windows-packaging.yml"
  pull_request:
    paths:
      - "scripts/release_windows*.py"
      - "scripts/release_smoke.py"
      - "scripts/release_common.py"
      - "scripts/test_release_windows*.py"
      - ".github/workflows/windows-packaging.yml"

permissions:
  contents: read

concurrency:
  group: windows-packaging-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tools:
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      - name: Pinned native Rust toolchain
        run: |
          rustup set default-host '${{ matrix.target }}'
          rustup toolchain install 1.98.0 --profile minimal
          host=$(rustc --version --verbose | sed -n 's/^host: //p')
          test "$host" = '${{ matrix.target }}'
      - name: Restore pinned native packaging tool
        id: packager-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .release-tools
          key: packager-v1-${{ matrix.os }}-${{ matrix.target }}-rust1.98.0-0.11.8
      - name: Install pinned packaging tool on cache miss
        if: steps.packager-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-packager --version 0.11.8 --locked --root .release-tools
      - name: Verify pinned packaging tool
        env:
          PYTHONPATH: scripts
          WORKBENCH_PACKAGER: ${{ github.workspace }}/.release-tools/bin/cargo-packager.exe
        run: python -c "from release_common import packager; print(packager())"
      - name: Save verified native packaging tool
        if: steps.packager-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .release-tools
          key: ${{ steps.packager-cache.outputs.cache-primary-key }}
      - name: Actual LLVM and NSIS compile/install with synthetic native executables
        env:
          WORKBENCH_PACKAGER: ${{ github.workspace }}/.release-tools/bin/cargo-packager.exe
        run: python scripts/release_windows_packaging_smoke.py --target '${{ matrix.target }}' --output 'target/windows-packaging-fixture/${{ matrix.target }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-packaging-fixture-${{ matrix.target }}
          path: target/windows-packaging-fixture/
          if-no-files-found: warn
          retention-days: 14

# This qualifies packaging tool integration only, never the actual application.
