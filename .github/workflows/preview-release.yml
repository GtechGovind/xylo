name: Prepare first native preview draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact workspace version tag (first preview: v0.1.0)"
        type: string
        required: true
        default: v0.1.0

permissions:
  contents: read

concurrency:
  group: preview-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Exact committed version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          version = tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must equal committed workspace version'
          PY
  native:
    needs: preflight
    uses: ./.github/workflows/native-release.yml
    permissions:
      contents: read
  draft:
    needs: native
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-preview-*
          path: target/native-results
      - name: Revalidate all six and create an unpublished unsigned prerelease draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/release_preview.py --inputs target/native-results --output target/preview-release \
            --commit "$GITHUB_SHA" --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" --create-draft

# Deliberately no tag/push trigger and no `gh release edit --draft=false`.
# A maintainer reviews the complete draft, checks limitations and publishes later.
