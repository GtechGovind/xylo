name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config clang libclang-dev libasound2-dev libudev-dev libgtk-3-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxrandr-dev libxi-dev libxtst-dev libegl1-mesa-dev libvulkan-dev libdbus-1-dev libssl-dev libsecret-1-dev libpipewire-0.3-dev libgbm-dev libfontconfig1-dev libfreetype6-dev bubblewrap socat
      - name: Pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Sandboxed command dependencies
        run: npm ci --prefix crates/services/sandbox-helper --ignore-scripts --no-audit --no-fund
      - name: Release signing policy tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace --locked
      - name: CLI scripted-provider acceptance
        shell: bash
        env:
          XYLO_EVAL_SCRIPT: .github/fixtures/cli-list-files.json
        run: |
          cargo run --locked -p xylo-cli -- -p "list files" --output-format json --data-dir "$RUNNER_TEMP/xylo-cli-acceptance" > "$RUNNER_TEMP/cli-result.json"
          python3 -c 'import json, os; result=json.load(open(os.environ["RUNNER_TEMP"]+"/cli-result.json")); assert result["exit_code"] == 0 and result["text"] == "Listed the workspace."'
      - name: Install RustSec audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Dependency audit
        run: cargo audit
