name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Pin the CI sandbox runtime
        shell: bash
        # Hosted tool caches are intentionally shared-writable. The workflow
        # explicitly trusts the Node installed by setup-node, like an operator
        # configured runtime; production discovery still rejects such paths.
        run: echo "XYLO_SANDBOX_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config clang libclang-dev libasound2-dev libudev-dev libgtk-3-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxrandr-dev libxi-dev libxtst-dev libegl1-mesa-dev libvulkan-dev libdbus-1-dev libssl-dev libsecret-1-dev libpipewire-0.3-dev libgbm-dev libfontconfig1-dev libfreetype6-dev bubblewrap socat ripgrep
      - name: Enable sandbox namespaces on the disposable Linux runner
        if: runner.os == 'Linux'
        shell: bash
        # Ubuntu's host policy blocks bwrap's isolated loopback setup. This
        # affects only this ephemeral CI VM, never an installed Xylo system.
        run: |
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --unshare-user --unshare-net -- /bin/true
      - name: Pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Rust build cache
        id: rust-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'crates/release-tool/Cargo.lock', 'rust-toolchain.toml', '.github/workflows/ci.yml') }}
          restore-keys: ci-${{ runner.os }}-${{ runner.arch }}-
      - name: Sandboxed command dependencies
        run: npm ci --prefix crates/services/sandbox-helper --ignore-scripts --no-audit --no-fund
      - name: Verify sandbox dependencies
        working-directory: crates/services/sandbox-helper
        run: >-
          node --input-type=module -e "import { SandboxManager } from '@anthropic-ai/sandbox-runtime';
          const result = await SandboxManager.checkDependenciesAsync();
          if (result.errors.length) throw new Error(result.errors.join('; '));"
      - name: Release signing policy tests
        run: cargo test --locked --manifest-path crates/release-tool/Cargo.toml
      - name: Obscura offline build-planning tests
        run: cargo test --locked -p xylo-build
      - name: Build pinned native Obscura from source (build-time network)
        # Native Linux x64 / macOS ARM64 only, never cross-build V8 snapshots.
        run: cargo run --locked -p xylo-build -- browser --profile debug --target ${{ matrix.target }}
      - name: Formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path crates/release-tool/Cargo.toml -- --check
      - name: Strict Clippy
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --locked --manifest-path crates/release-tool/Cargo.toml --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace --locked
      - name: Bundled browser local-fixture acceptance and cancellation
        shell: bash
        run: |
          mkdir -p target/debug/deps
          cp target/debug/xylo-obscura target/debug/deps/xylo-obscura
          cargo test --locked -p xylo-capabilities --lib browser::tests::bundled_ -- --ignored --test-threads=1
      - name: CLI scripted-provider acceptance
        shell: bash
        env:
          XYLO_EVAL_SCRIPT: .github/fixtures/cli-list-files.json
        run: |
          "$CARGO_TARGET_DIR/debug/xylo-cli" -p "list files" --output-format json --data-dir "$RUNNER_TEMP/xylo-cli-acceptance" > "$RUNNER_TEMP/cli-result.json"
          cargo run --locked --manifest-path crates/release-tool/Cargo.toml -- verify-cli-result "$RUNNER_TEMP/cli-result.json"
      - name: Install RustSec audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Dependency audit
        run: cargo audit
      - name: Save Rust build cache
        if: always() && !cancelled() && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
  browser-windows:
    # Windows x64 is upstream-qualified. Do not substitute an ARM64 runner or
    # cross target: the V8 build-time snapshot must match the executing host.
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Obscura offline build-planning tests
        run: cargo test --locked -p xylo-build
      - name: Build pinned native Obscura from source (build-time network)
        run: cargo run --locked -p xylo-build -- browser --profile debug --target x86_64-pc-windows-msvc
      - name: Bundled browser local-fixture acceptance and cancellation
        shell: bash
        run: |
          mkdir -p target/debug/deps
          cp target/debug/xylo-obscura.exe target/debug/deps/xylo-obscura.exe
          cargo test --locked -p xylo-capabilities --lib browser::tests::bundled_ -- --ignored --test-threads=1
