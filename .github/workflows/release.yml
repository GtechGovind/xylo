name: Release packages
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only actual native hosts: V8 startup snapshots cannot be cross-built.
          # Windows ARM64 is deliberately unsupported (no qualified upstream build).
          - os: macos-15
            target: aarch64-apple-darwin
            formats: app,dmg
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            formats: deb,appimage
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            formats: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Release packaging tests
        run: cargo test --locked --manifest-path crates/release-tool/Cargo.toml
      - name: Obscura offline build-planning tests
        run: cargo test --locked -p xylo-build
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config clang libclang-dev libasound2-dev libudev-dev libgtk-3-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxrandr-dev libxi-dev libxtst-dev libegl1-mesa-dev libvulkan-dev libdbus-1-dev libssl-dev libsecret-1-dev libpipewire-0.3-dev libgbm-dev libfontconfig1-dev libfreetype6-dev libfuse2 file patchelf desktop-file-utils
      - name: Pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Rust release cache
        id: rust-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'crates/release-tool/Cargo.lock', 'rust-toolchain.toml', 'crates/build*.rs', 'crates/build*/**') }}
          restore-keys: release-${{ runner.os }}-${{ runner.arch }}-
      - name: Build pinned native Obscura from source (build-time network)
        # The Rust planner fails before fetching for unsupported/cross targets.
        run: cargo run --locked -p xylo-build -- browser --profile release --target ${{ matrix.target }}
      - name: Qualify bundled browser with local fixtures
        shell: bash
        run: |
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; fi
          mkdir -p target/release/deps
          cp "target/release/xylo-obscura$suffix" "target/release/deps/xylo-obscura$suffix"
          cargo test --release --locked -p xylo-capabilities --lib browser::tests::bundled_ -- --ignored --test-threads=1
      - name: Build application binaries
        run: cargo build --release --locked -p xylo -p xylo-worker -p xylo-helper -p xylo-cli -p xylo-distribution --bins
      - name: Install pinned packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Package, sign and notarize when configured
        shell: bash
        env:
          PACKAGE_FORMATS: ${{ matrix.formats }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: cargo run --locked --manifest-path crates/release-tool/Cargo.toml -- package
      - name: Verify installed Obscura payload and nested macOS signature
        shell: bash
        run: cargo run --locked --manifest-path crates/release-tool/Cargo.toml -- verify-payload
      - name: Upload reviewable release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Xylo-${{ runner.os }}-${{ runner.arch }}
          path: dist/release/**
          if-no-files-found: error
          retention-days: 14
      - name: Save Rust release cache
        if: always() && !cancelled() && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
  publish:
    if: startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-rc.')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: Xylo-*
          path: dist/downloads
      - name: Publish verified release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo run --locked --manifest-path crates/release-tool/Cargo.toml -- publish
