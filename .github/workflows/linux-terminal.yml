name: Linux terminal regression checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/runtime/src/terminal.rs"
      - "crates/runtime/src/terminal/**"
      - "crates/runtime/validation/terminal/**"
      - ".github/workflows/linux-terminal.yml"
  pull_request:
    paths:
      - "crates/runtime/src/terminal.rs"
      - "crates/runtime/src/terminal/**"
      - "crates/runtime/validation/terminal/**"
      - ".github/workflows/linux-terminal.yml"

permissions:
  contents: read

concurrency:
  group: linux-terminal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terminal:
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Pinned native Rust toolchain
        run: |
          rustup set default-host '${{ matrix.target }}'
          rustup toolchain install 1.98.0 --profile minimal --component clippy
          host=$(rustc --version --verbose | sed -n 's/^host: //p')
          test "$host" = '${{ matrix.target }}'
      # Imports the production terminal, coalescing tests and real PTY tests.
      # No graphical stack, model, audio device or external service is needed.
      - name: Native terminal and PTY lifecycle tests
        run: cargo test --locked --manifest-path crates/runtime/validation/terminal/Cargo.toml --target '${{ matrix.target }}' -- --nocapture
      - name: Strict terminal-module Clippy
        run: cargo clippy --locked --manifest-path crates/runtime/validation/terminal/Cargo.toml --target '${{ matrix.target }}' --all-targets -- -D warnings
